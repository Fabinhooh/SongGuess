<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SongGuess - Pro</title>
    <style>
        :root { --bg-color: #0d0d0d; --card-bg: #181818; --primary: #1db954; --primary-hover: #1ed760; --text-main: #ffffff; --text-muted: #b3b3b3; --border-color: #282828; --correct: #1db954; --wrong: #e22134; }
        body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: var(--card-bg); padding: 30px; border-radius: 20px; width: 90%; max-width: 450px; box-shadow: 0 15px 40px rgba(0,0,0,0.7); text-align: center; max-height: 95vh; overflow-y: auto; border: 1px solid var(--border-color); }
        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        h1 { margin-top: 0; font-weight: 800; font-size: 28px; } .highlight { color: var(--primary); }
        h2 { font-size: 18px; margin-bottom: 20px; color: var(--text-muted); font-weight: normal;}
        h3 { border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-top: 25px; text-align: left; font-size: 16px;}
        .cover-container { width: 150px; height: 150px; margin: 0 auto 15px; border-radius: 15px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.5); background-color: #282828; display: flex; align-items: center; justify-content: center; }
        .cover-container img { width: 100%; height: 100%; object-fit: cover; }
        .genre-badge { background-color: var(--primary); color: #000; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; display: inline-block; margin-bottom: 15px; }
        .btn { background-color: var(--primary); color: #000; border: none; padding: 14px 20px; font-size: 16px; font-weight: bold; border-radius: 25px; cursor: pointer; width: 100%; margin-top: 15px; transition: transform 0.1s, background-color 0.2s; }
        .btn:disabled { background-color: #444; color: #888; cursor: not-allowed; transform: none !important;}
        .btn:hover:not(:disabled) { background-color: var(--primary-hover); transform: scale(1.02); }
        .btn-outline { background-color: transparent; border: 2px solid #555; color: var(--text-main); }
        .btn-small { padding: 10px 15px; font-size: 14px; margin-top: 10px; }
        .btn-danger { background-color: transparent; border: 2px solid var(--wrong); color: var(--wrong); }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 14px;}
        select, input[type="text"], input[type="number"], input[type="file"] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); background-color: #242424; color: white; font-size: 16px; box-sizing: border-box; transition: 0.3s; }
        select:focus, input:focus { outline: none; border-color: var(--primary); }
        .input-correct { background-color: var(--correct) !important; color: white !important; font-weight: bold;}
        .input-wrong { background-color: var(--wrong) !important; color: white !important; font-weight: bold;}
        .progress-container { width: 100%; background-color: var(--border-color); border-radius: 10px; height: 8px; margin: 20px 0; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background-color: var(--primary); transition: width 0.1s linear; }
        .tracker { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background-color: #333; }
        .dot.correct { background-color: var(--correct); box-shadow: 0 0 5px var(--correct); }
        .dot.wrong { background-color: var(--wrong); box-shadow: 0 0 5px var(--wrong); }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 20px; }
        .option-btn { background-color: #242424; color: white; border: 1px solid var(--border-color); padding: 16px; border-radius: 12px; cursor: pointer; transition: 0.2s; font-size: 15px; text-align: left;}
        .option-btn:hover:not(:disabled) { background-color: #333; border-color: var(--primary); }
        .option-btn.correct-choice { background-color: var(--correct) !important; border-color: white !important; color: black !important; font-weight: bold;}
        .option-btn.wrong-choice { background-color: var(--wrong) !important; border-color: white !important; font-weight: bold;}
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; text-align: left; }
        th, td { padding: 12px 8px; border-bottom: 1px solid var(--border-color); }
        .row-correct { border-left: 4px solid var(--correct); }
        .row-wrong { border-left: 4px solid var(--wrong); }
        .screen { display: none; animation: fadeIn 0.3s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;}
        .header-stats { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px;}
        .admin-song-list { max-height: 200px; overflow-y: auto; text-align: left; background: #121212; border-radius: 10px; padding: 10px; border: 1px solid #333; margin-bottom: 20px;}
        .admin-song-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #282828; font-size: 13px; }
        .admin-song-item:last-child { border-bottom: none; }
        .btn-edit { background: #333; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        .btn-edit:hover { background: var(--primary); color: black; }
        .admin-nav { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); }
        .admin-tab-btn { background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; padding: 10px 15px; font-weight: bold; margin-bottom: -1px;}
        .admin-tab-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .admin-tab-content { display: none; }
        .admin-tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        .provider-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 5px;}
        .badge-yt { background-color: #ff0000; color: white; }
        .badge-mp3 { background-color: #1db954; color: black; }
    </style>
</head>
<body>
    <div class="container">
        <!-- TELA DE LOGIN -->
        <div id="screen-login" class="screen active">
            <h1><span class="highlight">Song</span>Guess</h1>
            <h2>Identifique-se para jogar</h2>
            <div class="input-group"><input type="text" id="input-username" placeholder="Digite seu nome de usuário" autocomplete="off"></div>
            <button id="btn-login" class="btn">Entrar / Criar Perfil</button>
            <button onclick="mudarTela('screen-admin')" class="btn btn-outline btn-small" style="margin-top: 30px;">⚙️ Acesso Admin</button>
        </div>

        <!-- TELA INICIAL -->
        <div id="screen-start" class="screen">
            <h1 style="font-size: 22px; margin-bottom: 25px;">Olá, <span id="user-display-name" class="highlight"></span>!</h1>
            <div class="input-group"><label>Filtrar Categoria:</label>
                <select id="select-category-type" onchange="atualizarSubCategorias()">
                    <option value="tudo">Tudo Misturado</option><option value="genero">Por Gênero</option><option value="artista">Por Artista</option>
                </select>
            </div>
            <div class="input-group" id="group-subcategory" style="display: none;"><label>Escolha a opção:</label><select id="select-subcategory"></select></div>
            <div class="input-group"><label>Modo de Resposta:</label>
                <select id="select-mode"><option value="alternativas">Alternativas (4 Opções)</option><option value="digitar">Digitar o Nome</option></select>
            </div>
            <div class="input-group"><label>Rodadas:</label>
                <select id="select-rounds"><option value="10">10</option><option value="15">15</option><option value="20">20</option><option value="25">25</option><option value="30">30</option></select>
            </div>
            <button id="btn-start" class="btn">Iniciar Partida</button>
            <button onclick="mudarTela('screen-login')" class="btn btn-outline btn-small">Trocar Usuário</button>
        </div>

        <!-- TELA DE JOGO -->
        <div id="screen-game" class="screen">
            <div class="header-stats"><span>Perfil: <b id="game-username" class="highlight"></b></span><span>Acertos: <b id="game-total-score" class="highlight">0</b></span></div>
            <div class="tracker" id="score-tracker"></div>
            <h2>Música <span id="current-round-text" class="highlight">1</span> de <span id="total-rounds-text">10</span></h2>
            
            <div class="cover-container"><img id="music-cover-img" src="" alt="Capa"></div>
            <div id="music-genre-badge" class="genre-badge">Gênero</div>

            <button id="btn-play" class="btn">▶ Ouvir Trecho (12s)</button>
            <div class="progress-container"><div id="progress-bar" class="progress-bar"></div></div>
            <p id="status-text" style="font-size: 14px; color: var(--text-muted);">Clique para ouvir a música!</p>

            <div id="area-alternativas" class="options-grid"></div>
            <div id="area-digitar" style="display: none; margin-top: 20px;">
                <input type="text" id="input-answer" placeholder="Digite o nome exato...">
                <button id="btn-submit-text" class="btn btn-outline" style="margin-top:10px;">Confirmar</button>
            </div>
        </div>

        <!-- TELA FINAL -->
        <div id="screen-end" class="screen">
            <h1 class="highlight">Fim da Partida!</h1>
            <h2 id="final-score-text">Você acertou X de Y</h2>
            <div style="max-height: 300px; overflow-y: auto; margin-bottom: 20px;">
                <table id="results-table"><tbody id="results-body"></tbody></table>
            </div>
            <button onclick="location.reload()" class="btn">Voltar ao Início</button>
        </div>

        <!-- TELA DE ADMIN -->
        <div id="screen-admin" class="screen">
            <h1>⚙️ <span class="highlight">Admin</span></h1>
            
            <div class="admin-nav">
                <button class="admin-tab-btn active" onclick="mudarAbaAdmin('aba-playlist')">🎵 Playlist</button>
                <button class="admin-tab-btn" onclick="mudarAbaAdmin('aba-perfil')">👤 Perfil</button>
            </div>

            <div id="aba-playlist" class="admin-tab-content active">
                <h3>Todas as Músicas</h3>
                <div class="admin-song-list" id="admin-music-list"></div>

                <h3 id="admin-form-title">➕ Adicionar Nova Música</h3>
                <input type="hidden" id="edit-id" value=""> 
                <div class="input-group"><input type="text" id="add-titulo" placeholder="Título da Música"></div>
                <div class="input-group"><input type="text" id="add-artista" placeholder="Artista"></div>
                <div class="input-group"><input type="text" id="add-genero" placeholder="Gênero (ex: Pop, Rock)"></div>
                
                <div class="input-group">
                    <label>Provedor de Áudio:</label>
                    <select id="add-provedor">
                        <option value="youtube">YouTube (Sujeito a anúncios)</option>
                        <option value="mp3">Link Direto / MP3 (Sem anúncios)</option>
                    </select>
                </div>
                <div class="input-group"><input type="text" id="add-link" placeholder="Link do Youtube ou URL do MP3"></div>
                
                <div class="input-group"><input type="text" id="add-img" placeholder="Link da Imagem (Opcional)"></div>
                <div class="input-group"><input type="number" id="add-inicio" placeholder="Começar no segundo (ex: 45)"></div>
                <label style="font-size:12px; color:var(--text-muted); text-align:left; display:block;">3 Opções Erradas:</label>
                <div class="input-group"><input type="text" id="add-erro1" placeholder="Opção Errada 1 (Música - Artista)"></div>
                <div class="input-group"><input type="text" id="add-erro2" placeholder="Opção Errada 2"></div>
                <div class="input-group"><input type="text" id="add-erro3" placeholder="Opção Errada 3"></div>
                <button id="btn-save-music" onclick="adminSalvarMusica()" class="btn">Salvar Música</button>
                <button onclick="limparFormularioAdmin()" class="btn btn-outline btn-small" style="display:none;" id="btn-cancel-edit">Cancelar Edição</button>

                <h3>Exportar / Importar Playlist</h3>
                <div class="admin-grid">
                    <button onclick="exportarJSON('musicas')" class="btn btn-outline btn-small">📥 JSON</button>
                    <div style="position: relative;">
                        <button class="btn btn-outline btn-small w-100" style="width:100%;">📤 Importar</button>
                        <input type="file" accept=".json" style="position:absolute; top:0; left:0; opacity:0; width:100%; height:100%; cursor:pointer;" onchange="importarJSON(event, 'musicas')">
                    </div>
                </div>
                <div class="admin-grid">
                    <button onclick="exportarCSV()" class="btn btn-outline btn-small">📥 CSV</button>
                    <div style="position: relative;">
                        <button class="btn btn-outline btn-small w-100" style="width:100%;">📤 Importar</button>
                        <input type="file" accept=".csv" style="position:absolute; top:0; left:0; opacity:0; width:100%; height:100%; cursor:pointer;" onchange="importarCSV(event)">
                    </div>
                </div>
            </div>

            <div id="aba-perfil" class="admin-tab-content">
                <div style="background-color:#242424; padding:20px; border-radius:10px; text-align:center; margin-bottom: 20px;">
                    <h3 style="border:none; margin:0; padding:0; text-align:center; color:white;">Perfil Ativo: <span class="highlight" id="admin-perfil-nome">Nenhum</span></h3>
                    <p style="color:var(--text-muted); font-size:14px;">Acertos totais: <span id="admin-perfil-score">0</span></p>
                </div>
                <div class="admin-grid" style="margin-top: 20px;">
                    <button onclick="exportarJSON('perfil')" class="btn btn-outline btn-small">📥 Exportar Meu Perfil</button>
                    <div style="position: relative;">
                        <button class="btn btn-outline btn-small w-100" style="width:100%;">📤 Importar Perfil</button>
                        <input type="file" accept=".json" style="position:absolute; top:0; left:0; opacity:0; width:100%; height:100%; cursor:pointer;" onchange="importarJSON(event, 'perfil')">
                    </div>
                </div>
            </div>

            <button onclick="mudarTela('screen-login')" class="btn btn-danger" style="margin-top:30px;">Voltar ao Login</button>
        </div>

        <div id="youtube-player-container" style="position: absolute; left: -9999px;"><div id="youtube-player"></div></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const bancoPadrao = [
            { id: "1", provedor: "mp3", audio_url: "https://upload.wikimedia.org/wikipedia/commons/e/e5/Tetris_theme.ogg", titulo: "Tema do Tetris", artista: "Videogame", genero: "Geek", inicio_segundos: 0, imagem_capa: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/Tetris_logo.png/220px-Tetris_logo.png", opcoes_erradas: ["Super Mario - Nintendo", "Zelda - Nintendo", "Sonic - Sega"] },
            { id: "2", provedor: "youtube", audio_url: "4NRXx6U8ABQ", titulo: "Blinding Lights", artista: "The Weeknd", genero: "Pop", inicio_segundos: 25, imagem_capa: "https://i.scdn.co/image/ab67616d0000b2738863bc11d2aa12b54f5aeb36", opcoes_erradas: ["Starboy - The Weeknd", "As It Was - Harry Styles", "Levitating - Dua Lipa"] },
            { id: "3", provedor: "youtube", audio_url: "JGwWNGJdvx8", titulo: "Shape of You", artista: "Ed Sheeran", genero: "Pop", inicio_segundos: 30, imagem_capa: "https://i.scdn.co/image/ab67616d0000b273ba5db46f4b838ef6027e6f96", opcoes_erradas: ["Perfect - Ed Sheeran", "Sorry - Justin Bieber", "Havana - Camila Cabello"] },
            { id: "4", provedor: "youtube", audio_url: "ePjtnSPFWK8", titulo: "Evidências", artista: "Chitãozinho & Xororó", genero: "Sertanejo", inicio_segundos: 55, imagem_capa: "https://i.scdn.co/image/ab67616d0000b2733979857d4287bb4a595738cb", opcoes_erradas: ["Fio de Cabelo - Chitãozinho", "É o Amor - Zezé", "Dormi na Praça - Bruno & Marrone"] },
            { id: "5", provedor: "youtube", audio_url: "hTWKbfoikeg", titulo: "Smells Like Teen Spirit", artista: "Nirvana", genero: "Rock", inicio_segundos: 34, imagem_capa: "https://i.scdn.co/image/ab67616d0000b273e175a19e530c898d167d39bf", opcoes_erradas: ["Come As You Are - Nirvana", "Everlong - Foo Fighters", "Alive - Pearl Jam"] }
        ];

        let bancoDeMusicas = JSON.parse(localStorage.getItem('songguess_musicas')) || bancoPadrao;
        let perfilUsuario = { nome: "", acertosTotais: 0 };
        let ytPlayer = null; 
        let mp3Player = new Audio();
        let playlistJogo = [], rodadaAtual = 0, totalRodadas = 10, modoJogo = 'alternativas', historicoPartida = [], tempoLimite = 12, timerProgresso;
        let respostaFoiDada = false;

        function mudarTela(idTela) {
            document.querySelectorAll('.screen').forEach(tela => tela.classList.remove('active'));
            document.getElementById(idTela).classList.add('active');
            if(idTela === 'screen-start') popularFiltrosIniciais();
            if(idTela === 'screen-admin') {
                renderizarListaAdmin();
                document.getElementById('admin-perfil-nome').innerText = perfilUsuario.nome || 'Não Logado';
                document.getElementById('admin-perfil-score').innerText = perfilUsuario.acertosTotais || 0;
            }
        }

        function mudarAbaAdmin(idAba) {
            document.querySelectorAll('.admin-tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.admin-tab-content').forEach(aba => aba.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(idAba).classList.add('active');
        }

        document.getElementById('btn-login').addEventListener('click', () => {
            const nome = document.getElementById('input-username').value.trim();
            if(!nome) return alert("Digite um nome!");
            let perfisSalvos = JSON.parse(localStorage.getItem('songguess_perfis')) || {};
            perfilUsuario = perfisSalvos[nome] || { nome: nome, acertosTotais: 0 };
            perfisSalvos[nome] = perfilUsuario;
            localStorage.setItem('songguess_perfis', JSON.stringify(perfisSalvos));
            document.getElementById('user-display-name').innerText = perfilUsuario.nome;
            document.getElementById('game-username').innerText = perfilUsuario.nome;
            document.getElementById('game-total-score').innerText = perfilUsuario.acertosTotais;
            mudarTela('screen-start');
        });

        function salvarPerfil() {
            let perfisSalvos = JSON.parse(localStorage.getItem('songguess_perfis')) || {};
            perfisSalvos[perfilUsuario.nome] = perfilUsuario;
            localStorage.setItem('songguess_perfis', JSON.stringify(perfisSalvos));
            document.getElementById('game-total-score').innerText = perfilUsuario.acertosTotais;
            if(document.getElementById('screen-admin').classList.contains('active')){
                document.getElementById('admin-perfil-score').innerText = perfilUsuario.acertosTotais;
            }
        }

        function popularFiltrosIniciais() {
            bancoDeMusicas = JSON.parse(localStorage.getItem('songguess_musicas')) || bancoPadrao;
            document.getElementById('select-category-type').value = 'tudo';
            atualizarSubCategorias();
        }
        function atualizarSubCategorias() {
            const tipo = document.getElementById('select-category-type').value;
            const container = document.getElementById('group-subcategory');
            const select = document.getElementById('select-subcategory');
            select.innerHTML = '';
            if (tipo === 'tudo') { container.style.display = 'none'; return; }
            container.style.display = 'block';
            let valoresUnicos = [...new Set(bancoDeMusicas.map(m => m[tipo]))].sort();
            if(valoresUnicos.length === 0) { select.innerHTML = `<option>Vazio</option>`; return; }
            valoresUnicos.forEach(val => select.innerHTML += `<option value="${val}">${val}</option>`);
        }

        document.getElementById('btn-start').addEventListener('click', () => {
            modoJogo = document.getElementById('select-mode').value;
            let qtdPedida = parseInt(document.getElementById('select-rounds').value);
            let tipoFiltro = document.getElementById('select-category-type').value;
            let subCategoria = document.getElementById('select-subcategory').value;
            let musicasFiltradas = [...bancoDeMusicas];
            if (tipoFiltro !== 'tudo') musicasFiltradas = musicasFiltradas.filter(m => m[tipoFiltro] === subCategoria);
            if(musicasFiltradas.length === 0) return alert("Não há músicas nesta categoria!");
            
            totalRodadas = Math.min(qtdPedida, musicasFiltradas.length);
            document.getElementById('total-rounds-text').innerText = totalRodadas;
            playlistJogo = musicasFiltradas.sort(() => Math.random() - 0.5).slice(0, totalRodadas);
            historicoPartida = []; rodadaAtual = 0;
            document.getElementById('score-tracker').innerHTML = Array(totalRodadas).fill(0).map((_, i) => `<div class="dot" id="dot-${i}"></div>`).join('');
            mudarTela('screen-game');
            carregarRodada();
        });

        function carregarRodada() {
            respostaFoiDada = false;
            let musica = playlistJogo[rodadaAtual];
            document.getElementById('current-round-text').innerText = rodadaAtual + 1;
            
            document.getElementById('music-cover-img').src = musica.imagem_capa || 'https://via.placeholder.com/150/282828/FFFFFF?text=SongGuess';
            document.getElementById('music-genre-badge').innerText = musica.genero || 'Mix';
            document.getElementById('progress-bar').style.width = "0%";
            document.getElementById('status-text').innerText = "Ouça e adivinhe!";
            
            const btnPlay = document.getElementById('btn-play');
            btnPlay.innerText = "▶ Ouvir (12s)"; btnPlay.disabled = false;

            // CORREÇÃO: cueVideoById no lugar de loadVideoById evita o auto-play
            let provedor = musica.provedor || 'youtube';
            if(provedor === 'mp3') {
                mp3Player.src = musica.audio_url;
                mp3Player.currentTime = musica.inicio_segundos;
            } else {
                if(ytPlayer && ytPlayer.cueVideoById) { 
                    ytPlayer.cueVideoById({ videoId: musica.audio_url, startSeconds: musica.inicio_segundos }); 
                }
            }

            if (modoJogo === 'alternativas') {
                document.getElementById('area-alternativas').style.display = 'grid';
                document.getElementById('area-digitar').style.display = 'none';
                let resCerta = `${musica.titulo} - ${musica.artista}`;
                let opcoes = [resCerta, musica.opcoes_erradas[0], musica.opcoes_erradas[1], musica.opcoes_erradas[2]].sort(() => Math.random() - 0.5);
                
                let htmlOpcoes = '';
                opcoes.forEach(op => { htmlOpcoes += `<button class="option-btn" onclick="verificarResposta('${op.replace(/'/g, "\\'")}', this)">${op}</button>`; });
                document.getElementById('area-alternativas').innerHTML = htmlOpcoes;
            } else {
                document.getElementById('area-alternativas').style.display = 'none';
                document.getElementById('area-digitar').style.display = 'block';
                let inputTxt = document.getElementById('input-answer');
                inputTxt.value = ''; inputTxt.className = ''; inputTxt.disabled = false;
                let btnTxt = document.getElementById('btn-submit-text');
                btnTxt.innerText = "Confirmar"; btnTxt.className = "btn btn-outline"; btnTxt.disabled = false;
            }
        }

        document.getElementById('btn-play').addEventListener('click', (e) => {
            let musica = playlistJogo[rodadaAtual];
            let provedor = musica.provedor || 'youtube';
            
            if(provedor === 'mp3') {
                mp3Player.play();
            } else {
                if(!ytPlayer || !ytPlayer.playVideo) return alert("API do YouTube não carregou. Verifique sua conexão.");
                ytPlayer.playVideo(); 
            }
            
            e.target.disabled = true; e.target.innerText = "🎵 Tocando...";
            
            let tempo = 0; clearInterval(timerProgresso);
            timerProgresso = setInterval(() => {
                tempo += 0.1; document.getElementById('progress-bar').style.width = `${(tempo / tempoLimite) * 100}%`;
                if (tempo >= tempoLimite) {
                    clearInterval(timerProgresso); 
                    if(provedor === 'mp3') {
                        mp3Player.pause();
                        mp3Player.currentTime = musica.inicio_segundos;
                    } else {
                        ytPlayer.pauseVideo(); 
                        ytPlayer.seekTo(musica.inicio_segundos);
                    }
                    e.target.disabled = false; e.target.innerText = "▶ Ouvir Novamente";
                }
            }, 100);
        });

        document.getElementById('btn-submit-text').addEventListener('click', function() {
            if(respostaFoiDada) return;
            let digitado = document.getElementById('input-answer').value.toLowerCase().trim();
            let correto = playlistJogo[rodadaAtual].titulo.toLowerCase().trim();
            verificarResposta(digitado === correto ? "CORRETO" : "ERRO", this, true);
        });

        function verificarResposta(resposta, elemento, isTexto = false) {
            if(respostaFoiDada) return;
            respostaFoiDada = true; 
            clearInterval(timerProgresso);
            
            let musica = playlistJogo[rodadaAtual];
            let provedor = musica.provedor || 'youtube';
            if(provedor === 'mp3') mp3Player.pause();
            else if(ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();

            let acertou = false;
            let respostaCertaCompleta = `${musica.titulo} - ${musica.artista}`;

            if (modoJogo === 'alternativas' && resposta === respostaCertaCompleta) acertou = true;
            if (modoJogo === 'digitar' && resposta === "CORRETO") acertou = true;

            if (modoJogo === 'alternativas') {
                let botoes = document.querySelectorAll('.option-btn');
                botoes.forEach(b => {
                    b.disabled = true;
                    if(b.innerText === respostaCertaCompleta) b.classList.add('correct-choice');
                });
                if(!acertou) elemento.classList.add('wrong-choice');
            } else {
                let inputTxt = document.getElementById('input-answer');
                inputTxt.disabled = true; elemento.disabled = true;
                if(acertou) {
                    inputTxt.classList.add('input-correct'); elemento.innerText = "✔ Exato!"; elemento.classList.add('btn', 'correct-choice');
                } else {
                    inputTxt.classList.add('input-wrong'); inputTxt.value = `Errou. Era: ${musica.titulo}`; elemento.innerText = "✖"; elemento.classList.add('btn', 'wrong-choice');
                }
            }

            document.getElementById(`dot-${rodadaAtual}`).classList.add(acertou ? 'correct' : 'wrong');
            historicoPartida.push({ titulo: musica.titulo, artista: musica.artista, acertou: acertou });
            if(acertou) { perfilUsuario.acertosTotais += 1; salvarPerfil(); }

            setTimeout(() => {
                rodadaAtual++;
                if (rodadaAtual < totalRodadas) carregarRodada(); else finalizarJogo();
            }, 3000);
        }

        function finalizarJogo() {
            mudarTela('screen-end');
            let acertos = historicoPartida.filter(h => h.acertou).length;
            document.getElementById('final-score-text').innerText = `Você acertou ${acertos} de ${totalRodadas}!`;
            let tbody = document.getElementById('results-body'); tbody.innerHTML = '';
            historicoPartida.forEach(item => {
                tbody.innerHTML += `<tr class="${item.acertou ? 'row-correct' : 'row-wrong'}">
                    <td><b style="color:var(--text-main)">${item.titulo}</b> <br><small style="color:var(--text-muted)">${item.artista}</small></td>
                </tr>`;
            });
        }

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('youtube-player', { height: '0', width: '0', playerVars: { 'autoplay': 0, 'controls': 0 } });
        }

        // --- ADMIN LISTA E EDIÇÃO ---
        function renderizarListaAdmin() {
            const divList = document.getElementById('admin-music-list');
            divList.innerHTML = '';
            bancoDeMusicas.forEach(m => {
                let prov = m.provedor || 'youtube';
                let provBadge = prov === 'mp3' ? '<span class="provider-badge badge-mp3">MP3</span>' : '<span class="provider-badge badge-yt">YT</span>';
                divList.innerHTML += `
                    <div class="admin-song-item">
                        <div><b>${m.titulo}</b> - ${m.artista} ${provBadge}</div>
                        <button class="btn-edit" onclick="prepararEdicao('${m.id}')">✏️ Edit</button>
                    </div>`;
            });
        }

        function prepararEdicao(id) {
            let m = bancoDeMusicas.find(x => x.id === id);
            if(!m) return;
            document.getElementById('edit-id').value = m.id;
            document.getElementById('admin-form-title').innerText = "✏️ Editando: " + m.titulo;
            document.getElementById('add-titulo').value = m.titulo;
            document.getElementById('add-artista').value = m.artista;
            document.getElementById('add-genero').value = m.genero;
            document.getElementById('add-provedor').value = m.provedor || 'youtube';
            document.getElementById('add-link').value = m.audio_url || m.youtube_id; 
            document.getElementById('add-img').value = m.imagem_capa || '';
            document.getElementById('add-inicio').value = m.inicio_segundos;
            document.getElementById('add-erro1').value = m.opcoes_erradas[0];
            document.getElementById('add-erro2').value = m.opcoes_erradas[1];
            document.getElementById('add-erro3').value = m.opcoes_erradas[2];
            
            document.getElementById('btn-save-music').innerText = "🔄 Atualizar Música";
            document.getElementById('btn-cancel-edit').style.display = "inline-block";
            document.getElementById('admin-form-title').scrollIntoView({behavior: "smooth"});
        }

        function limparFormularioAdmin() {
            document.getElementById('edit-id').value = '';
            document.getElementById('admin-form-title').innerText = "➕ Adicionar Nova Música";
            document.getElementById('btn-save-music').innerText = "Salvar Música";
            document.getElementById('btn-cancel-edit').style.display = "none";
            document.getElementById('add-provedor').value = 'youtube';
            document.querySelectorAll('#aba-playlist input[type="text"], #aba-playlist input[type="number"], #aba-playlist input[type="hidden"]').forEach(i => i.value = '');
        }

        function adminSalvarMusica() {
            let idEdit = document.getElementById('edit-id').value;
            let tit = document.getElementById('add-titulo').value, art = document.getElementById('add-artista').value, 
                gen = document.getElementById('add-genero').value, lnk = document.getElementById('add-link').value,
                img = document.getElementById('add-img').value, ini = document.getElementById('add-inicio').value,
                prov = document.getElementById('add-provedor').value,
                e1 = document.getElementById('add-erro1').value, e2 = document.getElementById('add-erro2').value, e3 = document.getElementById('add-erro3').value;

            if(!tit || !art || !lnk || !gen) return alert("Preencha Título, Artista, Gênero e Link!");

            let finalLink = lnk;
            if(prov === 'youtube') {
                let match = lnk.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
                finalLink = (match && match[2].length === 11) ? match[2] : lnk;
            }

            let obj = {
                id: idEdit ? idEdit : Date.now().toString(),
                titulo: tit, artista: art, genero: gen, 
                provedor: prov, audio_url: finalLink, 
                inicio_segundos: parseInt(ini) || 0, imagem_capa: img,
                opcoes_erradas: [e1||"Erro 1", e2||"Erro 2", e3||"Erro 3"]
            };

            if(idEdit) { 
                let index = bancoDeMusicas.findIndex(x => x.id === idEdit);
                bancoDeMusicas[index] = obj; alert("Música ATUALIZADA!");
            } else { 
                bancoDeMusicas.push(obj); alert("Nova música ADICIONADA!");
            }

            localStorage.setItem('songguess_musicas', JSON.stringify(bancoDeMusicas));
            limparFormularioAdmin();
            renderizarListaAdmin();
        }

        function exportarJSON(tipo) {
            let dados = tipo === 'musicas' ? bancoDeMusicas : perfilUsuario;
            let nomeArq = tipo === 'musicas' ? 'songguess_playlist.json' : `songguess_perfil_${perfilUsuario.nome || 'usuario'}.json`;
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dados, null, 2));
            let a = document.createElement('a'); a.href = dataStr; a.download = nomeArq; document.body.appendChild(a); a.click(); a.remove();
        }
        
        function importarJSON(e, tipo) {
            const f = e.target.files[0]; if (!f) return;
            const r = new FileReader();
            r.onload = function(evt) {
                try { 
                    let obj = JSON.parse(evt.target.result);
                    if(tipo === 'musicas') {
                        if(!Array.isArray(obj)) return alert("Arquivo de playlist inválido!");
                        obj.forEach(m => { if(!m.audio_url && m.youtube_id) { m.audio_url = m.youtube_id; m.provedor = 'youtube'; }});
                        bancoDeMusicas = obj; localStorage.setItem('songguess_musicas', JSON.stringify(bancoDeMusicas)); 
                        alert("Playlist JSON importada!"); renderizarListaAdmin(); 
                    } else if(tipo === 'perfil') {
                        if(obj.nome === undefined) return alert("Arquivo de perfil inválido!");
                        perfilUsuario = obj; salvarPerfil();
                        document.getElementById('admin-perfil-nome').innerText = perfilUsuario.nome;
                        document.getElementById('admin-perfil-score').innerText = perfilUsuario.acertosTotais;
                        alert(`Perfil importado com sucesso!`);
                    }
                } catch (err) { alert("Erro ao ler JSON."); }
            }; r.readAsText(f);
        }

        function exportarCSV() {
            let cabecalho = "id;titulo;artista;genero;provedor;audio_url;inicio_segundos;imagem_capa;erro1;erro2;erro3\n";
            let linhas = bancoDeMusicas.map(m => {
                let prov = m.provedor || 'youtube';
                let url = m.audio_url || m.youtube_id;
                return `${m.id};${m.titulo};${m.artista};${m.genero};${prov};${url};${m.inicio_segundos};${m.imagem_capa || ''};${m.opcoes_erradas[0]};${m.opcoes_erradas[1]};${m.opcoes_erradas[2]}`;
            }).join('\n');
            let dataStr = "data:text/csv;charset=utf-8," + encodeURIComponent(cabecalho + linhas);
            let a = document.createElement('a'); a.href = dataStr; a.download = 'songguess_planilha.csv'; document.body.appendChild(a); a.click(); a.remove();
        }

        function importarCSV(e) {
            const f = e.target.files[0]; if (!f) return;
            const r = new FileReader();
            r.onload = function(evt) {
                try {
                    let texto = evt.target.result;
                    let linhas = texto.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                    if(linhas.length < 2) return alert("Planilha vazia ou inválida.");
                    
                    let novoBanco = [];
                    for(let i = 1; i < linhas.length; i++) {
                        let cols = linhas[i].split(';');
                        if(cols.length >= 7) {
                            novoBanco.push({
                                id: cols[0], titulo: cols[1], artista: cols[2], genero: cols[3],
                                provedor: cols[4], audio_url: cols[5],
                                inicio_segundos: parseInt(cols[6]) || 0, imagem_capa: cols[7] || '',
                                opcoes_erradas: [cols[8]||"Err 1", cols[9]||"Err 2", cols[10]||"Err 3"]
                            });
                        }
                    }
                    bancoDeMusicas = novoBanco;
                    localStorage.setItem('songguess_musicas', JSON.stringify(bancoDeMusicas));
                    alert("Planilha CSV importada com sucesso!");
                    renderizarListaAdmin();
                } catch (err) { alert("Erro ao ler CSV."); }
            }; r.readAsText(f);
        }
    </script>
